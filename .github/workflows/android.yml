name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Gerar APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gps-ciclismo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK na release "ultima-versao"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gps-ciclismo.apk
          gh release delete ultima-versao --yes --cleanup-tag || true
          gh release create ultima-versao gps-ciclismo.apk \
            --title "Última versão" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7}." \
            --prerelease
