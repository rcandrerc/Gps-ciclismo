name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Gerar APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gps-ciclismo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK na release "ultima-versao"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gps-ciclismo.apk
          NOTES=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          jq -n --argjson code "$GITHUB_RUN_NUMBER" --arg name "0.1.$GITHUB_RUN_NUMBER" --arg notes "$NOTES" \
            '{versionCode: $code, versionName: $name, notes: $notes}' > version.json
          gh release view ultima-versao >/dev/null 2>&1 || \
            gh release create ultima-versao --title "Última versão" --notes "APK atualizado automaticamente." --prerelease
          # APK primeiro; version.json por último, para o app só ver a versão nova quando o APK já estiver lá.
          gh release upload ultima-versao gps-ciclismo.apk --clobber
          gh release upload ultima-versao version.json --clobber
          gh release edit ultima-versao --notes "Versão 0.1.$GITHUB_RUN_NUMBER: $NOTES"
